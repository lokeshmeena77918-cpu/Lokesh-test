let cur=0,ans=Array(q.length).fill(null),rev=Array(q.length).fill(false),sec=10800,submitted=false;
function draw(){const x=q[cur];document.getElementById('paper').innerHTML=`<div class="muted">CET Senior Secondary • Set-2</div><div class="q">प्रश्न ${cur+1} / ${q.length}<br>${x[0]}</div>`+x[1].map((o,i)=>`<label class="opt ${ans[cur]===i?'sel':''}"><input type="radio" name="o" ${ans[cur]===i?'checked':''} onclick="choose(${i})"><b>${String.fromCharCode(65+i)}</b>) ${o}</label>`).join('')+`<div class="btns"><button class="gray" onclick="prev()">Previous</button><button class="orange" onclick="mark()">Mark for Review</button><button class="primary" onclick="next()">Next</button><button class="green" onclick="submitTest()">Submit Test</button></div>`;palette()}
function choose(i){ans[cur]=i;draw()}function next(){if(cur<q.length-1){cur++;draw()}}function prev(){if(cur>0){cur--;draw()}}function mark(){rev[cur]=!rev[cur];palette()}
function palette(){document.getElementById('palette').innerHTML=q.map((_,i)=>`<div class="n ${ans[i]!==null?'a':''} ${rev[i]?'r':''} ${i===cur?'c':''}" onclick="cur=${i};draw()">${i+1}</div>`).join('')}
function submitTest(){if(submitted)return;if(!confirm('क्या आप 150 प्रश्नों का टेस्ट जमा करना चाहते हैं?'))return;submitted=true;let attempted=ans.filter(x=>x!==null).length,correct=0;ans.forEach((a,i)=>{if(a!==null&&a===q[i][2])correct++});let wrong=attempted-correct,skip=q.length-attempted,percent=(correct/q.length*100).toFixed(2);document.getElementById('app').innerHTML=`<div class="card"><h2>🎉 टेस्ट समाप्त</h2><div class="stats"><div class="stat">स्कोर<br><b>${correct} / ${q.length}</b></div><div class="stat">प्रतिशत<br><b>${percent}%</b></div><div class="stat">सही<br><b>${correct}</b></div><div class="stat">गलत<br><b>${wrong}</b></div><div class="stat">छोड़े<br><b>${skip}</b></div><div class="stat">Attempted<br><b>${attempted}</b></div></div><p><button class="primary" onclick="location.reload()">फिर से टेस्ट दें</button></p></div>`}
setInterval(()=>{if(submitted)return;sec--;if(sec<=0){sec=0;submitTest();return}let h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;document.getElementById('timer').textContent=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`},1000);draw();
</script></body></html>
